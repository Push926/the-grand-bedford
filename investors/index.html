<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
      window.scrollTo(0, 0);
    </script>
    <title>The Grand Bedford — Investment Opportunity</title>
    <meta
      name="description"
      content="A $150,000 passive investment opportunity in The Grand Bedford — a prime Williamsburg cultural platform entering its revenue launch phase."
    />
    <meta property="og:title" content="The Grand Bedford — Investment Opportunity" />
    <meta
      property="og:description"
      content="15% passive economic interest at a $1M post-money valuation. Stabilize the platform and activate three direct revenue channels."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="../assets/investor-exterior-bedford.png" />
    <link rel="stylesheet" href="investors.css?v=14" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="memo-page">

    <div class="memo-gate" id="investor-gate" aria-hidden="false">
      <div class="memo-gate-card">
        <img src="../assets/GB logo.png" alt="" class="memo-gate-logo" width="56" height="56" />
        <p class="memo-gate-eyebrow">Private Access</p>
        <h1 class="memo-gate-title">Investor Memo</h1>
        <p class="memo-gate-copy">Enter the access password to view confidential investment materials.</p>
        <form class="memo-gate-form" id="investor-gate-form">
          <label class="memo-gate-label" for="investor-gate-password">Password</label>
          <input
            class="memo-gate-input"
            id="investor-gate-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
          <p class="memo-gate-error" id="investor-gate-error" hidden>Incorrect password. Please try again.</p>
          <button class="memo-btn memo-btn--primary memo-btn--full" type="submit">Enter</button>
        </form>
      </div>
    </div>

    <div id="investor-portal">
      <header class="memo-header">
        <div class="memo-header-inner">
          <a href="#hero" class="memo-brand">
            <img src="../assets/GB logo.png" alt="" width="36" height="36" />
            <span>The Grand Bedford</span>
          </a>
          <a class="memo-header-cta" href="#invest">Walkthrough</a>
        </div>
      </header>

      <main class="memo-main">
        <section class="memo-section memo-hero" id="hero"></section>
        <section class="memo-section memo-offer" id="offer"></section>
        <section class="memo-section memo-valuation" id="valuation"></section>
        <section class="memo-section memo-funds" id="use-of-funds"></section>
        <section class="memo-section memo-phases" id="phases"></section>
        <section class="memo-section memo-channels" id="channels"></section>
        <section class="memo-section memo-launch" id="launch-plan"></section>
        <section class="memo-section memo-roadmap" id="roadmap"></section>
        <section class="memo-section memo-returns" id="returns"></section>
        <section class="memo-section memo-people" id="people"></section>
        <section class="memo-section memo-proof" id="proof"></section>
        <section class="memo-section memo-risk" id="risk"></section>
        <section class="memo-section memo-invest" id="invest"></section>
      </main>

      <footer class="memo-footer">
        <p>© <span id="memo-year"></span> The Grand Bedford. Private investment materials.</p>
        <p class="memo-footer-address">165 Bedford Avenue, Brooklyn, NY 11211</p>
      </footer>

      <div class="memo-sticky-cta" id="memo-sticky-cta" hidden>
        <a class="memo-btn memo-btn--ghost" href="#invest">Walkthrough</a>
        <a class="memo-btn memo-btn--primary" href="#invest">View Opportunity</a>
      </div>
    </div>

    <script type="module" src="investors-auth.js?v=14"></script>
  </body>
</html>
